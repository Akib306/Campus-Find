image: node:22-alpine

stages: [deploy]

variables:
  PRODUCTION_URL: https://campus-find-three.vercel.app/

deploy_production:
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - set -eu
    - npx -y vercel@latest whoami --token "$VERCEL_TOKEN"
    - npx -y vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
    - >
      npx -y vercel@latest deploy --prod --token "$VERCEL_TOKEN"
      --build-env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
      --build-env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      --build-env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
      --env NEXT_PUBLIC_SUPABASE_URL="$NEXT_PUBLIC_SUPABASE_URL"
      --env NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY"
      --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY"
  environment:
    name: production
    url: $PRODUCTION_URL
